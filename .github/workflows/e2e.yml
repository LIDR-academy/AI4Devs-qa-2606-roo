name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos (principio de menor privilegio).
permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts evita ejecutar lifecycle scripts arbitrarios en la
      # instalación; el binario de Cypress se instala explícitamente después.
      - name: Install dependencies
        run: npm ci --ignore-scripts && npx cypress install

      # El backend está mockeado con cy.intercept: solo hace falta el frontend.
      - name: Cypress run
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          working-directory: frontend
          install: false
          start: npm start
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          if-no-files-found: ignore
